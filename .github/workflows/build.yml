name: Build Disc Image Manager

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set the version (1.6.build number)
        shell: bash
        run: |
          perl -pi -e "s/ApplicationVersion = '[0-9.]*';/ApplicationVersion = '1.6.${{ github.run_number }}';/" LazarusSource/MainUnit.pas
          perl -pi -e 's/ProductVersion="[0-9.]*"/ProductVersion="1.6.${{ github.run_number }}"/' LazarusSource/DiscImageManager.lpi
          grep -n "ApplicationVersion =" LazarusSource/MainUnit.pas
      - uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"
          with-cache: true
      - name: Build Win64
        working-directory: LazarusSource
        run: lazbuild -B --bm="Release Windows 64 bit" DiscImageManager.lpi
      - uses: actions/upload-artifact@v5
        with:
          name: DiscImageManager-win64
          path: LazarusSource/lib/Release/x86_64-win64/DiscImageManager.exe
          if-no-files-found: error

  windows32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set the version (1.6.build number)
        shell: bash
        run: |
          perl -pi -e "s/ApplicationVersion = '[0-9.]*';/ApplicationVersion = '1.6.${{ github.run_number }}';/" LazarusSource/MainUnit.pas
          perl -pi -e 's/ProductVersion="[0-9.]*"/ProductVersion="1.6.${{ github.run_number }}"/' LazarusSource/DiscImageManager.lpi
          grep -n "ApplicationVersion =" LazarusSource/MainUnit.pas
      - name: Restore Lazarus (32 bit) from the cache
        id: laz32
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-win32-choco-v1
      - name: Install Lazarus (32 bit)
        if: steps.laz32.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install lazarus --forcex86 -y --no-progress
      - name: Find lazbuild (32 bit)
        shell: pwsh
        run: |
          $laz = Get-ChildItem -Path 'C:\','C:\Program Files (x86)' -Filter lazbuild.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $laz) { throw 'lazbuild.exe not found' }
          Write-Host "Found $($laz.FullName)"
          "LAZBUILD=$($laz.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Win32
        working-directory: LazarusSource
        shell: pwsh
        run: '& $env:LAZBUILD -B --bm="Release Windows 32 bit" DiscImageManager.lpi'
      - uses: actions/upload-artifact@v5
        with:
          name: DiscImageManager-win32
          path: LazarusSource/lib/Release/i386-win32/DiscImageManager.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Set the version (1.6.build number)
        shell: bash
        run: |
          perl -pi -e "s/ApplicationVersion = '[0-9.]*';/ApplicationVersion = '1.6.${{ github.run_number }}';/" LazarusSource/MainUnit.pas
          perl -pi -e 's/ProductVersion="[0-9.]*"/ProductVersion="1.6.${{ github.run_number }}"/' LazarusSource/DiscImageManager.lpi
          grep -n "ApplicationVersion =" LazarusSource/MainUnit.pas
      - uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"
          with-cache: false  # the cache option breaks the macOS install of setup-lazarus
      - name: Build macOS Intel (x86_64)
        working-directory: LazarusSource
        run: |
          lazbuild -B --ws=cocoa --bm="Release macOS 64 bit" DiscImageManager.lpi
          mv lib/Release/x86_64-darwin/DiscImageManager ../DIM-x86_64
      - name: Build macOS Apple Silicon (aarch64)
        working-directory: LazarusSource
        run: |
          lazbuild -B --ws=cocoa --compiler=/usr/local/bin/fpc --opt=-k-ld_classic --bm="Release macOS ARM" DiscImageManager.lpi
          mv lib/Release/aarch64-darwin/DiscImageManager ../DIM-arm64
      - name: Make app bundles
        run: |
          for arch in x86_64 arm64; do
            app="out-$arch/Disc Image Manager.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "DIM-$arch" "$app/Contents/MacOS/DiscImageManager"
            cp LazarusSource/Icon.icns "$app/Contents/Resources/Icon.icns"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Disc Image Manager</string>
            <key>CFBundleExecutable</key><string>DiscImageManager</string>
            <key>CFBundleIdentifier</key><string>GJHSoftware.RetroComputing.DiscImageManager</string>
            <key>CFBundleIconFile</key><string>Icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.6.${{ github.run_number }}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>Disc Image</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSHandlerRank</key><string>Alternate</string>
              <key>LSItemContentTypes</key><array><string>public.data</string></array>
            </dict></array>
          </dict></plist>
          PLIST
            codesign --force --deep -s - "$app"
            ditto -c -k --keepParent "$app" "DiscImageManager-macOS-$arch.zip"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: DiscImageManager-macOS-x86_64
          path: DiscImageManager-macOS-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: DiscImageManager-macOS-arm64
          path: DiscImageManager-macOS-arm64.zip
          if-no-files-found: error

  release:
    needs: [windows, windows32, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Package files
        run: |
          cd dist
          zip -j DiscImageManager-win64.zip DiscImageManager-win64/DiscImageManager.exe
          zip -j DiscImageManager-win32.zip DiscImageManager-win32/DiscImageManager.exe
          mv DiscImageManager-macOS-x86_64/*.zip .
          mv DiscImageManager-macOS-arm64/*.zip .
          ls -l *.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Disc Image Manager (build ${{ github.run_number }})
          body: |
            Compilació automàtica del commit ${{ github.sha }}.
            Missatge: ${{ github.event.head_commit.message }}
          files: dist/*.zip
